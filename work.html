function measure(){const probe=document.createElement('div');probe.style.cssText='height:var(--H);position:absolute;pointer-events:none';document.body.append(probe);H=probe.getBoundingClientRect().height;probe.remove();W=innerWidth;ws=H*142/840;d=H*474/900;gap=H*.035;U=H*(W<768?1.05:1.3);cy=shelf.getBoundingClientRect().top+shelf.clientHeight/2;document.documentElement.style.setProperty('--ws',ws+'px');document.documentElement.style.setProperty('--depth',d+'px');XS=[0];for(let u=2;u<=U*4;u+=2)XS.push(XS.at(-1)+2/(1+(u/U)**1.6));$('.play-ring').style.left=W/2-d/2-6+'px';$('.play-ring').style.top=cy+.36*H+'px';}

async function openDetail(){if(detailOpen||!items.length)return;T=Math.round(T);if(Math.abs(T-s)>.3){s=T;}const index=mod(Math.round(T),N),p=items[index];savedFocus=document.activeElement;detailOpen=true;closing=false;$('.detail-kind').textContent=p.kind;$('#detail-title').textContent=p.title;$('.detail-meta').textContent=`Project ${String(index+1).padStart(2,'0')} / ${mode==='design'?'Design & interaction':'AI & machine learning'}`;$('.detail-description').textContent=p.description;$('.detail-approach').textContent=p.approach;$('.detail-tools').textContent=p.tools;const action=$('.detail-action');action.hidden=!p.url;action.textContent=p.linkLabel||'Explore project';if(p.url)action.href=p.url;$('.poster-image').setAttribute('href',await poster(p,index));$$('#ink-mask circle').forEach(c=>c.setAttribute('r','0'));inkStart=performance.now()+(reduced.matches?-5000:520);detail.scrollTop=0;detail.showModal();detail.append(cursor);const rect=coverRect();openAnim=detail.animate([{clipPath:inset(rect)},{clipPath:'inset(0px 0px 0px 0px round 0px)'}],{duration:reduced.matches?1:1050,easing:'cubic-bezier(.76,0,.18,1)',fill:'both'});$$('.detail-mask>*').forEach((el,i)=>el.animate([{transform:'translateY(110%)'},{transform:'translateY(0)'}],{duration:reduced.matches?1:900,delay:reduced.matches?0:620+i*75,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'}));cursor.className='cursor';}

addEventListener('keydown',e=>{if(e.key==='Escape'){$('.menu').hidden=true;$('.menu-toggle').setAttribute('aria-expanded','false');return;}if(detailOpen||$('.project-list-dialog').open||e.target.matches('input'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();go(e.key==='ArrowRight'?1:-1);}if(e.key==='Enter'&&!(e.target.closest('a,button,input'))){e.preventDefault();openDetail();}});
shelf.addEventListener('pointerdown',e=>{if(detailOpen||e.button>0)return;drag={x:e.clientX,y:e.clientY,T,id:e.pointerId};dragged=false;shelf.setPointerCapture(e.pointerId);});
